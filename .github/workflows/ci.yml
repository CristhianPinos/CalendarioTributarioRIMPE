name: CI - Pruebas y Evaluación

on:
  push:
    branches: [ main, "feature/**", "codex/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detectar secretos en el historial de Git
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Instalar dependencias del frontend
      working-directory: frontend
      run: npm ci

    - name: Compilar frontend de producción
      working-directory: frontend
      run: npm run build

    - name: Instalar dependencias del backend
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Ejecutar todas las pruebas del backend
      env:
        GEMINI_API_KEY: "dummy-key-para-ci"
      run: |
        python -m pytest backend/tests/ -q

    - name: Ejecutar evaluación formal de calidad y RAG
      env:
        GEMINI_API_KEY: "dummy-key-para-ci"
      run: |
        python eval/run_eval.py

    - name: Construir imagen Docker de producción
      run: docker build -t calendario-rimpe:ci .

    - name: Comprobar índice RAG antes y después del reinicio Docker
      run: |
        set -euo pipefail
        docker run --rm -d --name calendario-rimpe-rag-ci -p 127.0.0.1:18080:8000 calendario-rimpe:ci
        trap 'docker rm -f calendario-rimpe-rag-ci >/dev/null 2>&1 || true' EXIT
        pid_antes=$(docker inspect -f '{{.State.Pid}}' calendario-rimpe-rag-ci)
        imagen_antes=$(docker inspect -f '{{.Image}}' calendario-rimpe-rag-ci)
        fecha_antes=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        python scripts/check_rag_restart.py --output rag-antes.json
        docker restart calendario-rimpe-rag-ci
        pid_despues=$(docker inspect -f '{{.State.Pid}}' calendario-rimpe-rag-ci)
        imagen_despues=$(docker inspect -f '{{.Image}}' calendario-rimpe-rag-ci)
        fecha_despues=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        test "$pid_antes" != "$pid_despues"
        test "$imagen_antes" = "$imagen_despues"
        python scripts/check_rag_restart.py --output rag-despues.json --compare rag-antes.json
        echo "Proceso anterior: $pid_antes; proceso nuevo: $pid_despues"
        printf 'commit=%s\nimagen=%s\npid_antes=%s\npid_despues=%s\nfecha_antes_utc=%s\nfecha_despues_utc=%s\n' \
          "$GITHUB_SHA" "$imagen_antes" "$pid_antes" "$pid_despues" "$fecha_antes" "$fecha_despues" > rag-reinicio-meta.txt

    - name: Guardar evidencia del reinicio RAG
      uses: actions/upload-artifact@v4
      with:
        name: rag-reinicio-docker
        path: |
          rag-antes.json
          rag-despues.json
          rag-reinicio-meta.txt
