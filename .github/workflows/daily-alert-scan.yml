name: Escaneo diario de vencimientos

on:
  schedule:
    # 07:17 de Ecuador continental (UTC-5); se evita el inicio de la hora.
    - cron: "17 12 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Solicitar escaneo en la demostración
        env:
          SCAN_TRIGGER_TOKEN: ${{ secrets.SCAN_TRIGGER_TOKEN }}
        run: |
          if [ -z "$SCAN_TRIGGER_TOKEN" ]; then
            echo "Falta configurar SCAN_TRIGGER_TOKEN en GitHub Actions." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --max-time 180 \
            -X POST \
            -H "X-Scan-Token: $SCAN_TRIGGER_TOKEN" \
            https://calendario-rimpe-g11-demo.onrender.com/api/calendario/alertas/escanear
